# Driver Monitor thresholds. Edit and restart, or pass --config another.toml.
# Every key is optional; anything missing falls back to the default in state.py.
# Head and gaze limits are relative to the pose learned during calibration.

[general]
smoothing = 0.35            # 0..1, lower = smoother but laggier head/gaze

[calibration]
calib_good_s = 2.0          # seconds of attentive frames needed to learn your baseline ...
calib_window_s = 8.0        # ... within this rolling window
calib_ear_min = 0.2         # eyes clearly open (or blink blendshape below calib_blink_max)
calib_blink_max = 0.3
calib_jaw_max = 0.2         # mouth closed
calib_pose_deg = 15.0       # head near frontal

[eyes]
ear_ratio = 0.72            # eyes "closed" below this fraction of your open-eye EAR
ear_floor = 0.14
blink_score = 0.65          # MediaPipe eyeBlink blendshape, 0..1
ear_sure_ratio = 0.5        # with blendshapes, EAR alone counts only below threshold x this (looking down lowers lids, not shut)
microsleep_s = 1.2          # closed this long -> ALERT
perclos_window_s = 60.0
perclos_warn = 0.15         # closed >15% of the window -> fatigue WARN
perclos_min_s = 20.0        # need this much history before judging PERCLOS

[yawn]
yawn_jaw = 0.45             # MediaPipe jawOpen blendshape, 0..1 (lower = more sensitive)
yawn_mar = 0.45             # fallback mouth aspect ratio
yawn_min_s = 1.0            # jaw open this long counts as a yawn
yawn_notice_s = 3.0
yawn_window_s = 300.0
yawn_warn_count = 3
yawn_squint_s = 2.0         # eyes shut during a real yawn up to this long aren't a microsleep
eye_pose_yaw_deg = 30.0     # head turned past this: judge closed eyes from the blink blendshape only
eye_pose_pitch_deg = 25.0   # ... and head down past this

[attention]
yaw_limit_deg = 25.0        # head turned left/right
pitch_down_limit_deg = 15.0 # head down (lap, phone, radio)
pitch_up_limit_deg = 25.0
gaze_limit = 0.45           # eyes turned without moving the head, -1..1
hysteresis = 0.75
distraction_s = 2.0
no_face_s = 2.0             # driver not visible: WARN
no_face_alert_s = 5.0       # ... then ALERT

[phone]
phone_s = 1.0               # phone near the face this long -> ALERT
phone_down_s = 1.0          # phone in view while looking down -> ALERT
hand_at_ear_s = 2.0         # hand held at the ear -> "Phone call"
phone_grace_s = 0.6
